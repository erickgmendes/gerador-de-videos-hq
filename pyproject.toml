[project]
name = "biblia-audiovisual"
version = "0.1.0"
description = "Orquestrador de produção audiovisual bíblica (narração, imagens, vídeos, montagem, YouTube)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiofiles>=24.1",
    "python-slugify>=8.0",
    "openai>=1.50",
    "edge-tts>=7.0",
    "imageio-ffmpeg>=0.5",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
